# Cuts a release when a pull request is merged into main (or by hand from the Actions tab):
# tags the next version, then BigWigs' packager builds IWIN.zip, publishes the GitHub release and,
# once the CF_API_KEY secret and the toc's X-Curse-Project-ID are set, uploads it to CurseForge.
name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Tag the next version
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next=v1.0.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            case "$BUMP" in
              major) next="v$((major + 1)).0.0" ;;
              minor) next="v${major}.$((minor + 1)).0" ;;
              *)     next="v${major}.${minor}.$((patch + 1))" ;;
            esac
          fi
          echo "Releasing $next (previous: ${last:-none})"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Annotated: the packager reads the tag for the version and the changelog.
          git tag -a "$next" -m "IWIN $next"
          git push origin "$next"

      - name: Package and publish
        uses: BigWigsMods/packager@v2
